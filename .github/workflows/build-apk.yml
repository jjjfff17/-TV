name: Build LibreTV Native APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 源码指纹：把版本号和关键文件的 md5 打进构建日志。
      # 作用：以后怀疑"改动到底有没有进包"时，看日志就知道，不用靠猜。
      - name: 版本与源码指纹
        run: |
          set -euo pipefail
          echo "================= 源码指纹 ================="
          grep '^version:' pubspec.yaml || true
          md5sum lib/screens/player_screen.dart lib/screens/detail_screen.dart \
                 lib/screens/login_screen.dart lib/theme.dart lib/mpv_tuning.dart \
                 pubspec.yaml || true
          echo "============================================"

      - name: Scaffold Android project
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.libretv --project-name app /tmp/app
          rm -rf /tmp/app/lib
          # 图标/字体都放在 lib/assets 下，跟着 lib 一起拷走
          cp -r lib /tmp/app/lib
          cp pubspec.yaml /tmp/app/pubspec.yaml
          if [ -d assets ]; then cp -r assets /tmp/app/assets; fi
          python3 tool/patch_manifest.py /tmp/app/android/app/src/main/AndroidManifest.xml
          echo "--- 拷贝结果 ---"
          ls /tmp/app/lib
          echo "icons: $(ls /tmp/app/lib/assets/lanerc/icons | wc -l)"

      - name: Build release APK
        run: |
          cd /tmp/app
          flutter pub get
          # 只把编译错误当失败：警告/info 不拦构建，但错误会在出包前就暴露出来
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: libretv-native-apk
          # 只留 arm64 产物：74MB -> 约 41MB，国内下载时间减半
          path: /tmp/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
